<script>
const TEAMS=['Atlético-MG','Athletico-PR','Bahia','Botafogo','Chapecoense','Corinthians','Coritiba','Cruzeiro','Flamengo','Fluminense','Grêmio','Internacional','Mirassol','Palmeiras','Red Bull Bragantino','Remo','Santos','São Paulo','Vasco','Vitória'];
const LOCAL=['Atletico-MG.jpg','Athletico-PR.jpg','Bahia.jpg','Botafogo.jpg','Chapecoense.jpg','Corinthians.jpg','Coritiba.jpg','Cruzeiro.jpg','Flamengo.jpg','Fluminense.jpg','Gremio.jpg','Internacional.jpg','Mirassol.jpg','Palmeiras.jpg','Red-Bull-Bragantino.jpg','Remo.jpg','Santos.jpg','Sao-Paulo.jpg','Vasco.jpg','Vitoria.jpg'];
const repo='mantostore2026/catalogo';
function card(team,src){return `<article class="card"><div class="photo"><img loading="lazy" src="${src}" alt="Camisa ${team} Modelo 1 2026"><button class="heart" aria-label="Favoritar">♡</button></div><div class="info"><h3>${team}</h3><p>Modelo 1 • 2026</p><button class="buy" onclick="buy('${team}')"><span>◉</span> Comprar via WhatsApp</button></div></article>`}
function render(files){const grid=document.getElementById('catalogo');grid.innerHTML='';TEAMS.forEach((team,i)=>grid.insertAdjacentHTML('beforeend',card(team,files[i])));document.getElementById('countTeams').textContent=TEAMS.length}
async function loadImages(){try{const r=await fetch(`https://api.github.com/repos/${repo}/contents/images?ref=main`,{cache:'no-store'});if(!r.ok)throw 0;const data=await r.json();const files=data.filter(x=>/\.(jpe?g|png|webp)$/i.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name,navigator.language,{numeric:true})).map(x=>x.download_url);if(files.length>=20){render(files.slice(0,20));return}throw 0}catch(e){render(LOCAL.map(x=>'images/'+x))}}
function buy(team){const msg=`Olá! Tenho interesse na camisa ${team} — Modelo 1 • 2026. Gostaria de saber tamanhos e disponibilidade.`;window.open('https://wa.me/5534997170789?text='+encodeURIComponent(msg),'_blank')}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?'':'none')});
loadImages();
</script>
</body>
</html>
