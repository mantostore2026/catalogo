.modalgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;padding:18px}
.modalphoto{background:#f2f2f2;border-radius:14px;min-height:430px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.modalphoto img{width:100%;height:100%;max-height:560px;object-fit:contain}
.modalinfo{padding:8px}
.modalinfo h2{font-size:25px;margin:4px 0}
.modalinfo .model{color:#d7d7d7;margin-bottom:18px}
.close{position:absolute;right:18px;top:14px;border:0;background:#222;color:#fff;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer}
.modal{position:relative}
.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#ddd}
.field input,.field select{width:100%;height:45px;border-radius:10px;border:1px solid #45494b;background:#171a1b;color:#fff;padding:0 12px;box-sizing:border-box}
.opt{font-size:11px;color:#999;margin-top:4px}
.qty{display:flex;align-items:center;gap:10px;margin:12px 0}.qty button{width:36px;height:36px;border-radius:9px;border:1px solid #444;background:#171a1b;color:#fff;font-size:20px}.qty span{min-width:25px;text-align:center;font-weight:900}
.modalactions{display:grid;gap:8px;margin-top:15px}.modalactions button{height:45px;border-radius:10px;border:0;font-weight:900;cursor:pointer}.primary{background:#f4c400;color:#111}.secondary{background:#202426;color:#fff;border:1px solid #414547!important}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);background:#0b0d0e;z-index:220;transform:translateX(105%);transition:.25s;box-shadow:-20px 0 60px rgba(0,0,0,.55);border-left:1px solid #34383a;color:#fff;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawerhead{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid #292d2f}.drawerhead h2{margin:0}
.drawerbody{padding:14px;overflow:auto;flex:1}
.cartitem{display:grid;grid-template-columns:74px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #25292b}.cartitem img{width:74px;height:84px;object-fit:contain;background:#eee;border-radius:8px}.cartitem h4{margin:2px 0 5px;font-size:13px}.cartitem p{margin:2px 0;color:#aaa;font-size:11px}.remove{border:0;background:none;color:#aaa;cursor:pointer;font-size:18px}.drawerfoot{padding:14px;border-top:1px solid #292d2f}.whats{width:100%;height:46px;border:0;border-radius:11px;background:#f4c400;color:#111;font-weight:900;cursor:pointer}
@media(max-width:700px){.modalgrid{grid-template-columns:1fr;padding:12px}.modalphoto{min-height:300px}.modalinfo{padding:4px}.buyrow{grid-template-columns:1fr 1fr}.drawer{width:94vw}}
</style>

const repo='mantostore2026/catalogo';
let repoFiles=[];

function norm(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
}
function teamKeys(team){
  const aliases={
    'Red Bull Bragantino':['redbullbragantino','bragantino'],
    'Atlético-MG':['atleticomg','atletico'],
    'Athletico-PR':['athleticopr','athletico'],
    'São Paulo':['saopaulo','sao'],
    'Grêmio':['gremio'],
    'Vitória':['vitoria'],
    'Internacional':['internacional'],
    'Chapecoense':['chapecoense'],
    'Corinthians':['corinthians']
  };
  return aliases[team] || [norm(team)];
}
function repoUrl(file){
  return file ? (file.download_url || `https://raw.githubusercontent.com/${repo}/main/images/${encodeURIComponent(file.name)}`) : '';
}
function findByModel(team,model){
  const keys=teamKeys(team);
  const candidates=repoFiles.filter(f=>{
    const fn=norm(f.name);
    const hasTeam=keys.some(k=>fn.includes(k));
    const hasModel=model===1 ? /(uniforme1|modelo1)/.test(fn) : model===2 ? /(uniforme2|modelo2)/.test(fn) : /(uniforme3|modelo3)/.test(fn);
    return hasTeam && hasModel;
  });
  if(candidates.length) return repoUrl(candidates[0]);
  return '';
}
function findModel1(team){
  const hit=findByModel(team,1);
  if(hit) return hit;
  const c=MODEL1[team]||[];
  return c.length ? `images/${c[c.length-1]}` : '';
}
function findModel2(team){
  const exact=MODEL2[team];
  const exactHit=repoFiles.find(f=>exact && f.name.toLowerCase()===exact.toLowerCase());
  return repoUrl(exactHit) || findByModel(team,2) || (exact ? `images/${exact}` : '');
}
function findModel3(team){
  const exact=MODEL3[team];
  if(!exact) return '';
  const hit=repoFiles.find(f=>f.name && f.name.toLowerCase()===exact.toLowerCase());
  if(hit) return repoUrl(hit);
  const variants=[
    exact,
    exact.replace(/\.jpg$/i,'.jpeg'),
    exact.replace(/-modelo-3-2026/i,'-uniforme-3-26-27'),
    exact.replace(/-modelo-3-2026/i,'-uniforme-3-26-27').replace(/\.jpg$/i,'.jpeg')
  ];
  for(const v of variants){
    const h=repoFiles.find(f=>f.name && f.name.toLowerCase()===v.toLowerCase());
    if(h) return repoUrl(h);
  }
  // Nomes confirmados pelo usuário: procurar também pelas versões curtas do nome do clube.
  const altNames={
    'Atlético-MG':['Atletico-MG','Atletico-Mg','Atletico'],
    'Flamengo':['Flamengo'],
    'Red Bull Bragantino':['Red-Bull-Bragantino','Bragantino','red-bull-bragantino'],
    'São Paulo':['Sao-Paulo','Sao-Paulo','Sao Paulo']
  };
  const names=altNames[team]||[];
  const num=String(TEAMS.indexOf(team)+1).padStart(2,'0');
  for(const name of names){
    const vv=[
      `${num}-${name}-uniforme-3-26-27.png`,
      `${num}-${name}-uniforme-3-26-27.jpg`,
      `${num}-${name}-uniforme-3-26-27.jpeg`,
      `${num}-${name}-modelo-3-2026.png`,
      `${num}-${name}-modelo-3-2026.jpg`,
      `${num}-${name}-modelo-3-2026.jpeg`
    ];
    for(const v of vv){
      const h=repoFiles.find(f=>f.name && f.name.toLowerCase()===v.toLowerCase());
      if(h) return repoUrl(h);
    }
  }
  return `https://raw.githubusercontent.com/${repo}/main/images/${encodeURIComponent(exact)}`;
}

function esc(s){
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}
function fallbackUrls(team,model,firstSrc){
  const out=[];
  const add=(x)=>{if(x && !out.includes(x)) out.push(x);};
  add(firstSrc);
  const m1=MODEL1[team]||[];
  if(model===1){
    m1.forEach(x=>add(`images/${x}`));
    const n=TEAMS.indexOf(team)+1;
    const names=[team, team.replace('Atlético','Atletico').replace('Grêmio','Gremio').replace('São Paulo','Sao-Paulo').replace('Vitória','Vitoria')];
    names.forEach(name=>{
      [String(n).padStart(2,'0'),String(n)].forEach(num=>{
        add(`images/${num} - ${name} - Uniforme 1 26-27.jpeg`);
        add(`images/${num}-${name}-uniforme-1-26-27.jpeg`);
        add(`images/${num}-${name}-uniforme-1-26-27.jpg`);
        add(`images/${num}-${name}-modelo-1-2026.jpg`);
      });
      add(`images/${name}-uniforme-1-26-27.jpeg`);
      add(`images/${name}-uniforme-1-26-27.jpg`);
    });
  } else if(model===3){
    const exact=MODEL3[team]||'';
    const n=TEAMS.indexOf(team)+1;
    const num=String(n).padStart(2,'0');
    const cleanName=team.replace('Atlético','Atletico').replace('Grêmio','Gremio').replace('São Paulo','Sao-Paulo').replace('Vitória','Vitoria');
    const slug=norm(team);
    const paths=['images','modelo3','modelos3','modelo-3','modelos/modelo3','images/modelo3','images/modelos3'];
    paths.forEach(dir=>{
      add(`${dir}/${exact}`);
      [num,String(n)].forEach(x=>{
        add(`${dir}/${x}-${slug}-modelo-3-2026.jpg`);
        add(`${dir}/${x}-${slug}-modelo-3-2026.jpeg`);
        add(`${dir}/${x}-${slug}-uniforme-3-26-27.jpg`);
        add(`${dir}/${x}-${slug}-uniforme-3-26-27.jpeg`);
        add(`${dir}/${x} - ${cleanName} - Uniforme 3 26-27.jpeg`);
        add(`${dir}/${x} - ${cleanName} - Uniforme 3 2026.jpeg`);
        add(`${dir}/${x} - ${cleanName} - Modelo 3 2026.jpeg`);
        add(`${dir}/${x}-${cleanName}-uniforme-3-26-27.jpeg`);
        add(`${dir}/${x}-${cleanName}-modelo-3-2026.jpeg`);
      });
      add(`${dir}/${slug}-modelo-3-2026.jpg`);
      add(`${dir}/${slug}-modelo-3-2026.jpeg`);
    });
  }
  return out;
}
function card(team,src,model){
  const safeTeam=esc(team);
  const urls=fallbackUrls(team,model,src);
  const safeSrc=esc(urls[0]||'');
  const safeFallbacks=esc(JSON.stringify(urls.slice(1)));
  return `<article class="card">
    <div class="photo" onclick="openProduct('${safeTeam}',${model},'${safeSrc}')">
      ${urls.length?`<img loading="lazy" src="${urls[0]}" data-fallbacks="${safeFallbacks}" alt="Camisa ${team} Modelo ${model} 2026" onerror="nextImage(this)">`:'<div class="missing">⚠️</div>'}
      <button class="heart" aria-label="Favoritar" onclick="event.stopPropagation()">♡</button>
    </div>
    <div class="info"><h3>${team}</h3><p>Modelo ${model} • 2026</p>
      <div class="buyrow">
        <button class="buy" onclick="event.stopPropagation();buyNow('${safeTeam}',${model},'${safeSrc}')">Comprar agora</button>
        <button class="addcart" onclick="event.stopPropagation();openProduct('${safeTeam}',${model},'${safeSrc}')">Adicionar</button>
      </div>
    </div>
  </article>`;
}
function nextImage(img){
  let list=[];
  try{ list=JSON.parse(img.dataset.fallbacks||'[]'); }catch(e){}
  if(list.length){
    const next=list.shift();
    img.dataset.fallbacks=JSON.stringify(list);
    img.src=next;
    return;
  }
  img.onerror=null;
  img.parentElement.innerHTML='<div class="missing">⚠️</div><button class="heart" aria-label="Favoritar">♡</button>';
}
function render(){
  const grid=document.getElementById('catalogo');
  grid.innerHTML='';
  if(activeTab==='europa'){
    EUROPE_PRODUCTS.forEach(([team,model,src])=>{
      grid.insertAdjacentHTML('beforeend',card(team,src,model.includes('26/27')?'1':1));
    });
    document.getElementById('sectionTitle').textContent='Camisas Europeias • 2026/27';
    document.getElementById('countLabel').textContent='30 clubes';
    document.getElementById('countTeams').textContent=30;
  }else{
    TEAMS.forEach(team=>{
      if(activeTab==='todos' || activeTab==='brasil'){
        const m1=findModel1(team);
        const m2=findModel2(team);
        const m3=findModel3(team);
        if(m1) grid.insertAdjacentHTML('beforeend',card(team,m1,1));
        if(m2) grid.insertAdjacentHTML('beforeend',card(team,m2,2));
        if(m3) grid.insertAdjacentHTML('beforeend',card(team,m3,3));
      }
    });
    document.getElementById('sectionTitle').textContent='Times Brasileirão • 2026';
    document.getElementById('countLabel').textContent='Modelos 1, 2 e 3';
    document.getElementById('countTeams').textContent=57;
  }
  applySearch();
}
function setTab(tab,btn){
  activeTab=tab;
  document.querySelectorAll('#mainNav button[data-tab]').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  else{
    const b=document.querySelector(`#mainNav button[data-tab="${tab}"]`);
    if(b)b.classList.add('active');
  }
  const search=document.getElementById('search');
  if(search)search.value='';
  render();
}
function applySearch(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  document.querySelectorAll('.card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?'':'none');
}

function openProduct(team,model,src){
  currentProduct={team,model,src};
  currentQty=1;
  document.getElementById('modalTitle').textContent=team;
  document.getElementById('modalModel').textContent=`Modelo ${model} • 2026`;
  document.getElementById('modalImage').src=src;
  document.getElementById('modalImage').alt=`Camisa ${team} Modelo ${model} 2026`;
  document.getElementById('size').value='';
  document.getElementById('name').value='';
  document.getElementById('number').value='';
  document.getElementById('qty').textContent='1';
  document.getElementById('productModal').classList.add('show');
}
function closeProduct(){
  document.getElementById('productModal').classList.remove('show');
}
function changeQty(delta){
  currentQty=Math.max(1,currentQty+delta);
  document.getElementById('qty').textContent=currentQty;
}
function getCustomization(){
  const size=document.getElementById('size').value;
  if(!size){alert('Escolha o tamanho da camisa.');return null;}
  const name=document.getElementById('name').value.trim();
  const number=document.getElementById('number').value.trim();
  if(number && !/^\d{1,2}$/.test(number)){alert('Digite um número de 0 a 99.');return null;}
  return {size,name,number,qty:currentQty};
}
function addCurrentToCart(close=true){
  if(!currentProduct)return;
  const c=getCustomization(); if(!c)return;
  const item={...currentProduct,...c,id:Date.now()+Math.random()};
  cart.push(item);
  updateCart();
  if(close)closeProduct();
  alert('Camisa adicionada ao carrinho!');
}
function buyNow(team,model,src){ openProduct(team,model,src); }
function confirmDirect(){
  const c=getCustomization(); if(!c || !currentProduct)return;
  let msg=`Olá! Quero comprar:\n${c.qty}x ${currentProduct.team} — Modelo ${currentProduct.model} • 2026\nTamanho: ${c.size}`;
  if(c.name)msg+=`\nNome: ${c.name}`;
  if(c.number)msg+=`\nNúmero: ${c.number}`;
  msg+='\n\nGostaria de finalizar o pedido.';
  window.open('https://wa.me/5534997170789?text='+encodeURIComponent(msg),'_blank');
  closeProduct();
}
function updateCart(){
  document.querySelector('.badge').textContent=cart.reduce((s,i)=>s+i.qty,0);
  const body=document.getElementById('cartBody');
  if(!cart.length){body.innerHTML='<div style="padding:35px 10px;text-align:center;color:#999">Seu carrinho está vazio.</div>';return;}
  body.innerHTML=cart.map((i,idx)=>`
    <div class="cartitem">
      <img src="${i.src}" alt="">
      <div><h4>${i.team} — Modelo ${i.model}</h4>
      <p>${i.qty}x • Tamanho ${i.size}</p>
      ${i.name?`<p>Nome: ${i.name}</p>`:''}
      ${i.number?`<p>Número: ${i.number}</p>`:''}</div>
      <button class="remove" onclick="removeCart(${idx})">×</button>
    </div>`).join('');
}
function removeCart(i){cart.splice(i,1);updateCart();}
function openCart(){updateCart();document.getElementById('cartDrawer').classList.add('show')}
function closeCart(){document.getElementById('cartDrawer').classList.remove('show')}
function checkoutCart(){
  if(!cart.length){alert('Seu carrinho está vazio.');return;}
  let msg='Olá! Quero fazer um pedido na Manto Store:\n\n';
  cart.forEach((i,n)=>{
    msg+=`${n+1}. ${i.qty}x ${i.team} — Modelo ${i.model} • 2026\n`;
    msg+=`Tamanho: ${i.size}\n`;
    if(i.name)msg+=`Nome: ${i.name}\n`;
    if(i.number)msg+=`Número: ${i.number}\n`;
    msg+='\n';
  });
  msg+='Gostaria de finalizar o pedido e saber as opções de pagamento.';
  window.open('https://wa.me/5534997170789?text='+encodeURIComponent(msg),'_blank');
}
async function loadImages(){
  const dirs=['images','europeus','modelo3','modelos3','modelo-3','modelos/modelo3','images/modelo3','images/modelos3'];
  const refs=['main','master'];
  const found=[];
  for(const ref of refs){
    for(const dir of dirs){
      try{
        const u=`https://api.github.com/repos/${repo}/contents/${dir}?ref=${ref}`;
        const r=await fetch(u,{cache:'no-store'});
        if(!r.ok) continue;
        const data=await r.json();
        if(Array.isArray(data)){
          data.filter(x=>x.type==='file' && /\.(jpe?g|png|webp)$/i.test(x.name)).forEach(x=>found.push(x));
        }
      }catch(e){}
    }
  }
  const seen=new Set();
  repoFiles=found.filter(f=>{const k=(f.path||f.name||'').toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true;});
  render();
}
document.getElementById('search').addEventListener('input',applySearch);
loadImages();
